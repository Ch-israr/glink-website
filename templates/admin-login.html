<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Globe Link International</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="icon" type="image/png" href="/static/images/favicon.png">
</head>
<body class="admin-login-page">
<div class="admin-login-card">
  <span class="logo-mark">G</span>
  <h1>Globe Link Admin</h1>
  <p class="form-note">Sign in to manage the website content and view enquiries.</p>
  {{ERROR}}
  <form method="post" action="/admin/login">
    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="form-note back-link"><a href="/">Back to the website</a></p>
</div>
</body>
</html>
